# Memory guard for the console (CT116 has 16 GB shared with the stem server). On 2026-11-16 an unbounded
# pair-atlas rebuild grew the process to 15.7 GB and took the container down; now the cgroup throttles
# at High and kills + restarts only this unit at Max. Install:
#   pct push 116 memory.conf /etc/systemd/system/nullset-dj.service.d/memory.conf
#   systemctl daemon-reload && systemctl restart nullset-dj
[Service]
MemoryHigh=8G
MemoryMax=10G
# the stem server is its own unit; keep the OOM killer on the console first
OOMScoreAdjust=300
